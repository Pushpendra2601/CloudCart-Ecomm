global:
  namespace: cloudcart
  labels:
    app.kubernetes.io/part-of: cloudcart

frontend:
  replicaCount: 2
  image:
    repository: ghcr.io/YOUR_USER/cloudcart-frontend
    tag: "1.0.0"
    pullPolicy: IfNotPresent
  service:
    port: 80
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 300m
      memory: 256Mi

backend:
  replicaCount: 2
  image:
    repository: ghcr.io/YOUR_USER/cloudcart-backend
    tag: "1.0.0"
    pullPolicy: IfNotPresent
  service:
    port: 8080
  env:
    NODE_ENV: production
    API_PORT: "8080"
    REDIS_HOST: cloudcart-redis
    POSTGRES_HOST: cloudcart-postgres
  resources:
    requests:
      cpu: 200m
      memory: 256Mi
    limits:
      cpu: 750m
      memory: 512Mi
  hpa:
    enabled: true
    minReplicas: 2
    maxReplicas: 8
    cpuAverageUtilization: 65

postgres:
  image: postgres:17-alpine
  storage: 10Gi
  user: cloudcart
  database: cloudcart
  password: ChangeMeStrongPassword
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1Gi

redis:
  image: redis:7.4-alpine
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 300m
      memory: 256Mi

ingress:
  enabled: true
  className: nginx
  host: cloudcart.local
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"

monitoring:
  serviceMonitor:
    enabled: true
    labels:
      release: monitoring

networkPolicy:
  enabled: true
