apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudcart-redis
  namespace: {{ .Values.global.namespace }}
  labels:
    app: cloudcart-redis
    {{- include "cloudcart.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cloudcart-redis
  template:
    metadata:
      labels:
        app: cloudcart-redis
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: redis
          image: {{ .Values.redis.image | quote }}
          ports:
            - name: redis
              containerPort: 6379
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            {{- toYaml .Values.redis.resources | nindent 12 }}
