apiVersion: v1
kind: Service
metadata:
  name: cloudcart-postgres
  namespace: {{ .Values.global.namespace }}
  labels:
    app: cloudcart-postgres
    {{- include "cloudcart.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    app: cloudcart-postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
